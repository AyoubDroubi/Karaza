name: CI

# 每次 push / PR 驗證 app 能否正常編譯（含以 submodule 引入的翻譯引擎）。
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch: {}  # manual run from the Actions tab

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build app
    runs-on: ubuntu-latest
    steps:
      # 翻譯引擎是 git submodule（公開），要 recursive 才抓得到（composite build 依賴它）。
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      # packages 要明寫：這個 action 預設會跑 `sdkmanager tools`，新版 cmdline-tools 已經沒有 `tools` 這個套件
      # （Failed to find package 'tools' → exit 1，後面的步驟全部跳過；2026-09-17 起 CI 因此一直紅）。
      # NDK／CMake 由 AGP 依 ndkVersion（app 與引擎的 inference-core 都釘 28.2.13676358）自動下載，授權在這一步接受。
      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Make gradlew executable
        run: chmod +x ./gradlew

      # debug build，不帶 -Pinclude-telemetry / -Penable-updater（免 Firebase/google-services、updater）。
      # gitignored 的 api-keys / local.properties 缺檔有後備（key→空字串、SDK→ANDROID_HOME），CI 不需提供。
      - name: Build (compile check)
        run: |
          set -o pipefail
          ./gradlew :app:assembleDebug --no-daemon --stacktrace 2>&1 | tee build.log

      # On failure, surface the compiler/Gradle errors as run annotations so they are readable
      # from the run summary (and the API) without opening the full log.
      - name: Report build errors
        if: failure()
        run: |
          [ -f build.log ] || exit 0
          grep -E '^e: |^w: .*error|error:' build.log | head -10 | while IFS= read -r l; do
            echo "::error title=Compile error::$(printf '%s' "$l" | sed 's/%/%25/g')"
          done
          sed -n '/What went wrong/,/^\* Try/p' build.log | head -40 > wrong.txt || true
          if [ -s wrong.txt ]; then
            echo "::error title=Gradle failure::$(sed 's/%/%25/g' wrong.txt | awk '{printf "%s%%0A", $0}')"
          fi

      # Keep the built APKs so they can be downloaded from the run page (Artifacts section).
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: karaza-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 14

      # Unit tests run after the APK is uploaded, so a failing test never blocks getting the build.
      # The engine repo is a fork (forks do not run Actions by default), so its tests run here.
      - name: Engine unit tests
        run: |
          set -o pipefail
          cd yakuyomi-engine
          chmod +x ./gradlew
          ./gradlew :inference-core:testDebugUnitTest :engine:testDebugUnitTest --no-daemon 2>&1 | tee ../test.log

      - name: App translation unit tests
        run: |
          set -o pipefail
          ./gradlew :app:testDebugUnitTest --tests 'eu.kanade.tachiyomi.data.translation.*' --no-daemon 2>&1 | tee -a test.log

      - name: Report test failures
        if: failure()
        run: |
          [ -f test.log ] || exit 0
          grep -E 'FAILED|AssertionError|expected:|What went wrong|^e: ' test.log | head -15 | while IFS= read -r l; do
            echo "::error title=Test failure::$(printf '%s' "$l" | sed 's/%/%25/g')"
          done

